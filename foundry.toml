[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Deployment profile: heavier optimisation for the live Arbitrum One deploy.
[profile.production]
optimizer_runs = 1000
via_ir = true

[fmt]
line_length = 100

[rpc_endpoints]
arbitrum = "https://arb1.arbitrum.io/rpc"
